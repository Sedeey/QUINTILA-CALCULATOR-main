<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1b">
  <meta name="description" content="QUINTILA CALCULATOR — a modern calculator with customizable themes and calculation history.">
  <title>QUINTILA CALCULATOR</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="4" y="3" width="32" height="34" rx="9" fill="currentColor" opacity=".16"/>
          <rect x="10" y="8" width="20" height="7" rx="2" fill="currentColor"/>
          <path d="M12 21h3m5 0h3m5 0h.1M12 28h3m5 0h3m5 0h.1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div>
          <p class="eyebrow">EVERYDAY MATH, MADE CLEAR</p>
          <h1>QUINTILA <span>CALCULATOR</span></h1>
        </div>
      </div>
      <button class="settings-button" type="button" data-action="settings" aria-label="Open theme settings" aria-expanded="false" aria-controls="theme-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 4.75v-2.5l-2.05-.62a6.4 6.4 0 0 0-.55-1.32l1.02-1.88-1.77-1.77-1.88 1.02a6.4 6.4 0 0 0-1.32-.55L12.83 3.6h-2.5l-.62 2.05a6.4 6.4 0 0 0-1.32.55L6.5 5.18 4.73 6.95l1.02 1.88a6.4 6.4 0 0 0-.55 1.32l-2.05.62v2.5l2.05.62c.12.46.3.9.55 1.32l-1.02 1.88 1.77 1.77 1.88-1.02c.42.24.86.43 1.32.55l.62 2.05h2.5l.62-2.05c.46-.12.9-.3 1.32-.55l1.88 1.02 1.77-1.77-1.02-1.88c.24-.42.43-.86.55-1.32l2.05-.62Z"/></svg>
      </button>
    </header>

    <section class="theme-panel" id="theme-panel" aria-labelledby="theme-title" hidden>
      <div>
        <h2 id="theme-title">Choose Your Color</h2>
        <p>Switch between different themes to match your style.</p>
      </div>
      <div class="theme-options" role="group" aria-label="Calculator color themes">
        <button class="theme-option" type="button" data-theme="blue" aria-pressed="true"><span class="theme-swatch blue"></span>Blue</button>
        <button class="theme-option" type="button" data-theme="purple" aria-pressed="false"><span class="theme-swatch purple"></span>Purple</button>
        <button class="theme-option" type="button" data-theme="green" aria-pressed="false"><span class="theme-swatch green"></span>Green</button>
        <button class="theme-option" type="button" data-theme="orange" aria-pressed="false"><span class="theme-swatch orange"></span>Orange</button>
        <button class="theme-option" type="button" data-theme="light" aria-pressed="false"><span class="theme-swatch light"></span>Light</button>
      </div>
    </section>

    <section class="calculator" aria-label="Quintila calculator">
      <div class="workbench">
        <div class="display" aria-live="polite" aria-atomic="true">
          <div class="display-topline">
            <span class="display-label">DISPLAY</span>
            <button class="copy-button" type="button" data-action="copy" aria-label="Copy result">Copy result</button>
          </div>
          <div class="expression" id="expression" aria-label="Expression">0</div>
          <output class="result" id="result" aria-label="Result">0</output>
        </div>

        <div class="keypad" aria-label="Calculator keypad">
          <button class="key key-dark" type="button" data-action="clear" aria-label="Clear all">C</button>
          <button class="key key-function" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="key key-function" type="button" data-value="%" aria-label="Percent">%</button>
          <button class="key key-function" type="button" data-value="/" aria-label="Divide">÷</button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key key-function" type="button" data-value="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key key-function" type="button" data-value="-" aria-label="Subtract">−</button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key key-function" type="button" data-value="+" aria-label="Add">+</button>

          <button class="key key-wide" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value="." aria-label="Decimal point">.</button>
          <button class="key key-dark key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>

      <aside class="history" aria-labelledby="history-title">
        <div class="history-heading">
          <div>
            <p class="display-label">RECENT WORK</p>
            <h2 id="history-title">History</h2>
          </div>
          <button class="clear-history" type="button" data-action="clear-history" aria-label="Clear history">Clear</button>
        </div>
        <ol class="history-list" id="history-list" aria-live="polite">
          <li class="history-empty">Your calculations will appear here.</li>
        </ol>
      </aside>
    </section>
    <footer class="page-footer">A LITTLE SPACE FOR BIG NUMBERS <span>· QUINTILA</span></footer>
  </main>
</body>
</html>
